<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      /* PRO TABLE STYLES */
      .table-toggle {
        transition: all 0.3s ease;
      }
      .data-table {
        background: rgba(255, 255, 255, 0.95) !important;
        border-radius: 12px !important;
        border: 1px solid #e0e6ed !important;
        max-height: 250px !important;
        overflow: auto !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08) !important;
      }
      .data-table .header-row {
        color: #3b82f6 !important;
        background: rgba(59, 130, 246, 0.1) !important;
        font-weight: 700 !important;
      }
      .data-table .hover-row {
        transition: all 0.2s ease !important;
        cursor: pointer !important;
        border-radius: 8px !important;
        margin: 0 -1rem !important;
        padding: 0.75rem 1rem !important;
      }
      .data-table .hover-row:hover {
        background: linear-gradient(90deg, #3b82f6, #60a5fa) !important;
        color: white !important;
        transform: translateX(4px) !important;
      }
      .table-btn {
        background: rgba(59, 130, 246, 0.1) !important;
        border: 2px solid #3b82f6 !important;
        color: #1e40af !important;
        font-weight: 600 !important;
      }
      .table-btn.active {
        background: #3b82f6 !important;
        color: white !important;
        transform: translateY(-1px) !important;
      }
    </style>
  </head>
  <body class="p-5 bg-light">
    <!-- PRO TABLE DEMO -->
    <div class="card shadow-lg mx-auto" style="max-width: 600px">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
          Readymix Inventory <i class="fas fa-info-circle ms-2"></i>
        </h5>
      </div>
      <div class="card-body p-4">
        <!-- Chart Placeholder -->
        <div
          class="chart-container mb-4"
          style="
            height: 300px;
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-weight: 700;
          "
        >
          📊 CHART HERE (Bar/Line/Pie)
        </div>

        <!-- PRO TABLE TOGGLE -->
        <div class="table-toggle">
          <button class="btn btn-sm table-btn w-100" data-target="demoTable">
            📋 Show Detailed Data <i class="fas fa-chevron-down ms-2"></i>
          </button>
          <div id="demoTable" class="data-table mt-3 p-3" style="display: none">
            <!-- JS populates here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      // TEST DATA
      window.chartData = {
        readymix: {
          labels: [
            "4000psi-28d",
            "3000psi-28d",
            "5000psi-28d",
            "2500psi-7d",
            "3500psi-28d",
          ],
          data: [1250, 980, 750, 420, 650],
        },
      };

      // PRO TABLE FUNCTION
      function initProTable() {
        const btn = document.querySelector(".table-btn");
        const table = document.getElementById("demoTable");
        const icon = btn.querySelector("i");

        btn.onclick = function () {
          if (table.style.display === "none") {
            // SHOW TABLE
            table.style.display = "block";
            btn.classList.add("active");
            icon.className = "fas fa-chevron-up ms-2";
            btn.innerHTML =
              '📋 Hide Detailed Data <i class="fas fa-chevron-up ms-2"></i>';
            populateTable();
          } else {
            // HIDE TABLE
            table.style.display = "none";
            btn.classList.remove("active");
            icon.className = "fas fa-chevron-down ms-2";
            btn.innerHTML =
              '📋 Show Detailed Data <i class="fas fa-chevron-down ms-2"></i>';
          }
        };
      }

      function populateTable() {
        const table = document.getElementById("demoTable");
        const labels = window.chartData.readymix.labels;
        const data = window.chartData.readymix.data;

        table.innerHTML = `
                <div class="row header-row align-items-center py-2 mb-3">
                    <div class="col-8">Design Mix</div>
                    <div class="col-4 text-end">Stock (m³)</div>
                </div>
                ${labels
                  .map((label, i) => {
                    const value = data[i];
                    const colorClass =
                      value > 1000
                        ? "text-success"
                        : value > 600
                          ? "text-warning"
                          : "text-danger";
                    return `
                        <div class="row align-items-center hover-row">
                            <div class="col-8 fw-medium">${label}</div>
                            <div class="col-4 text-end fs-5 fw-bold ${colorClass}">${value.toLocaleString()}</div>
                        </div>
                    `;
                  })
                  .join("")}
            `;
      }

      // INIT
      initProTable();
    </script>
  </body>
</html>
