    <style>
      /* ===== GLOBAL STYLES ===== */
      /* Base styling for body with gradient background and default font */
      body {
            font-family: Arial, sans-serif;
            background: #BFC3AA;
            margin: 0;
            padding: 0;
            padding-bottom: 60px;
        }

      /* Heading styles */

        font-size: 1.15em !important;

        font-size: 1.2em !important;

      }

      /* Card header styling */

        font-size: 1.2em !important;
        font-weight: 600;
      }

      /* Main container - max width 1400px */

        max-width: 1400px;

      }

      /* Header section with glassmorphism effect */
      .header {
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid #e0e6ed;

        padding: 40px;

      }

      /* Card container styling */
      .card {
        background: white;

        margin-bottom: 30px;
        overflow: hidden;
        border: 1px solid #e8ecf4;

      }

      /* Card hover effect */
      .card:hover {
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }

      /* Card header gradient backgrounds */
      .card-header {
        color: white;
        padding: 25px 30px;
        font-size: 1.2em;
        border: none;
      }

      /* Status badge - High stock (green) */
      .status-high {
        background: #c6efce;
        color: #006100;
        padding: 6px 14px;
        border-radius: 4px;
        font-weight: 500;
        font-size: 0.9em;
        border: 1px solid #b8dabb;
      }

      /* Status badge - Medium stock (yellow) */

        background: #ffeb9c;
        color: #9c6500;
        padding: 6px 14px;
        border-radius: 4px;
        font-weight: 500;
        font-size: 0.9em;

      }

      /* Status badge - Low stock (red) */
      .status-low {

        padding: 6px 14px;
        border-radius: 4px;
        font-weight: 500;
        font-size: 0.9em;
        border: 1px solid #f4b4b9;
      }

      /* Total row background (blue) */
      .total-row {
        background: #4472c4 !important;
        color: white !important;
        font-weight: 700;
        border-top: 3px solid #365a99;
      }

      /* Numeric value inside number class */
      .number {
        font-size: 1.15em;
        font-weight: 700;

      }

      /* Modern button styling */
      .btn-modern {
        border-radius: 4px;
        padding: 14px 32px;
        font-weight: 600;
        font-size: 1em;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border: 1px solid #d1d5db;
        transition: all 0.2s ease;
        text-transform: none;
        letter-spacing: 0.5px;
        font-family: "Calibri", "Segoe UI", sans-serif;

      }

      /* Button hover effect */
      .btn-modern:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        transform: translateY(-2px);
      }

      /* Primary button (blue) */

        background: #4472c4;
        border-color: #365a99;
        color: white;
      }

      .btn-primary:hover {
        background: #365a99;
      }

      /* Success button (green) */

        background: #70ad47;
        border-color: #5a8f36;
        color: white;
      }

      .btn-success:hover {
        background: #5a8f36;
      }

      /* Excel-style table styling */
      .table-excel {
        font-family: "Calibri", "Segoe UI", Arial, sans-serif;
        font-size: 14px;
        border-collapse: collapse;
        margin-bottom: 0;
        background: white;
        width: 100%;
        table-layout: fixed;
      }

      /* Table header styling */
      .table-excel thead th {
        background: #4472c4 !important;
        color: white !important;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 18px 16px !important;
        border: 1px solid #365a99;
        vertical-align: middle;
        white-space: nowrap;
      }

      /* Table cell styling */
      .table-excel td {
        padding: 16px 16px !important;
        border: 1px solid #d1d5db;
        vertical-align: middle;
        background: #ffffff;
        height: 32px;
        word-wrap: break-word;
      }

      /* Table row height */
      .table-excel tbody tr {
        height: 32px;
      }

      /* Zebra striping for table rows */
      .table-excel tbody tr:nth-child(even) {
        background: #f8f9fa;
      }

      /* Row hover effect */
      .table-excel tbody tr:hover {
        background: #e7f3ff !important;
        font-weight: 500;
      }

      /* Ranking cell styling (for sales table) */
      .table-excel .rank-cell {
        background: #f2f2f2;
        font-weight: 700;
        text-align: center;
        width: 60px;
        font-size: 16px;
        padding: 16px 8px !important;
      }

      /* ===== PRINT STYLES - EACH TABLE ON ITS OWN PAGE ===== */
      @media print {
        body {
          background: white !important;
          padding: 0 !important;
          margin: 0 !important;
          font-size: 11px;
        }
        
        .no-print {
          display: none !important;
        }
        
        .container {
          padding: 0 !important;
          margin: 0 !important;
          max-width: 100% !important;
        }
        
        /* Hide the original header when printing */
        .header {
          display: none !important;
        }
        
        /* Each card starts on a new page */
        .card {
          page-break-before: always !important;
          break-before: page !important;
          margin: 0 !important;
          margin-bottom: 0 !important;
          box-shadow: none !important;
          border: 1px solid #dee2e6 !important;
        }
        
        /* First card starts on page 1 (no break before) */
        .card:first-of-type {
          page-break-before: avoid !important;
          break-before: auto !important;
        }
        
        /* Add a header to each printed page using CSS */
        .card::before {
          content: "Sorcom Summary Report";
          display: block;
          text-align: center;
          font-size: 18px;
          font-weight: bold;
          color: #2c3e50;
          margin-bottom: 15px;
          padding-bottom: 10px;
          border-bottom: 2px solid #4472c4;
        }
        
        /* Add date range after title */
        .card::after {
          content: "Period: " attr(data-date);
          display: block;
          text-align: center;
          font-size: 12px;
          color: #6c757d;
          margin-top: 10px;
          margin-bottom: 15px;
        }
        
        .table-excel {
          font-size: 11px;
          border-collapse: collapse;
        }
        
        .table-excel th,
        .table-excel td {
          border: 1px solid #000 !important;
          padding: 8px 6px !important;
        }
        
        .table-excel thead th {
          background: #4472c4 !important;
          color: white !important;
          font-size: 11px !important;
        }
        
        /* Prevent orphaned rows */
        tr, thead, tbody {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
      }

      /* ===== RESPONSIVE STYLES ===== */
      @media (max-width: 992px) {
        .container {
          max-width: 100%;

        }

          font-size: 12px;
        }

      }

      @media (max-width: 768px) {

        }
        .btn-modern {
          padding: 12px 24px;
          font-size: 0.95em;
          min-width: 150px;
        }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // =========================================================================
      // JAVASCRIPT FUNCTIONALITY - DATA FETCHING, TABLE POPULATION, PDF EXPORT
      // =========================================================================

      // === UTILITY FUNCTIONS ===
      
      // Determines the correct base path for API calls based on current URL location
      const getBasePath = () => {
        const path = window.location.pathname;
        if (path.includes("summary_reports.html") || path.includes("summary/"))
          return "../";
        if (path.includes("/reports/")) return "../../";
        return "./";
      };

      const basePath = getBasePath();
      
      // Extracts start and end dates from URL parameters or uses defaults
      const urlParams = new URLSearchParams(window.location.search);
      const startDate =
        urlParams.get("start_date") || urlParams.get("start") || "2024-04-01";
      const endDate =
        urlParams.get("end_date") ||
        urlParams.get("end") ||
        new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
          .toISOString()
          .split("T")[0];

      // Formats a date string into readable format (e.g., "Jan 15, 2024")
      const formatDate = (dateStr) =>
        new Date(dateStr).toLocaleDateString("en-US", {
          month: "short",
          day: "2-digit",
          year: "numeric",
        });
      
      const dateRangeText = `${formatDate(startDate)} - ${formatDate(endDate)}`;
      
      // Updates the header with the selected date range
      document.getElementById("dateRange").textContent = dateRangeText;
      
      // Set data-date attribute on cards for print header
      document.querySelectorAll('.card').forEach(card => {
        card.setAttribute('data-date', dateRangeText);
      });

      // Global data store for all three tables
      let chartData = {
        readymix: { labels: [], data: [] },
        mixture: { labels: [], data: [] },
        sales: { labels: [], data: [] },
      };

      // === STATUS CALCULATION ===
      // Determines stock status (High/Medium/Low) based on value and dataset thresholds
      function getStatus(value, values, type = "readymix") {
        if (!values.length || values.every((v) => v === 0))
          return { text: "No Data", class: "status-low" };

        const max = Math.max(...values);
        const min = Math.min(...values.filter((v) => v > 0));
        const range = max - min || 1;

        let highThreshold, lowThreshold;
        if (type === "mixture") {
          highThreshold = max * 0.8;
          lowThreshold = max * 0.3;
        } else {
          highThreshold = min + range * 0.7;
          lowThreshold = min + range * 0.3;
        }

        if (value >= highThreshold)
          return { text: "High Stock", class: "status-high" };
        if (value >= lowThreshold)
          return { text: "Medium Stock", class: "status-medium" };
        return { text: "Low Stock", class: "status-low" };
      }

      // === TABLE POPULATION ===
      // Renders data into the specified table with appropriate formatting and totals
      function populateTable(tableId, data, isSales = false) {
        const tbody = document.querySelector(`#${tableId} tbody`);

        // Fallback data if no data is available
        if (!data.labels?.length || !data.data?.length) {
          data = getFallbackData(tableId);
        }

        let rows = "";
        const maxRows = isSales ? 5 : 8;
        const labelsToShow = data.labels.slice(0, maxRows);
        const dataToShow = data.data.slice(0, maxRows);

        // Generate individual data rows
        labelsToShow.forEach((label, i) => {
          const value = dataToShow[i] || 0;

          if (isSales) {
            // Sales table: shows rank, design mix, and sold quantity
            rows += `
        <tr>
          <td class="rank-cell text-primary">${i + 1}</td>
          <td><strong>${label}</strong></td>
          <td class="text-end"><span class="number">${value.toLocaleString()}</span></td>
        </tr>`;
          } else {
            // Inventory tables: shows material, stock, and status badge
            const status = getStatus(
              value,
              dataToShow,
              tableId === "mixtureTable" ? "mixture" : "readymix",
            );
            rows += `
        <tr>
          <td><strong>${label}</strong></td>
          <td class="text-end"><span class="number">${value.toLocaleString()}</span></td>
          <td><span class="${status.class}">${status.text}</span></td>
        </tr>`;
          }
        });

        // Calculate and add total row
        const total = dataToShow.reduce((a, b) => a + (b || 0), 0);
        const unit = "kgs/m³";

        if (isSales) {
          rows += `
      <tr class="total-row">
        <td><strong>TOTAL</strong></td>
        <td></td>
        <td class="text-end"><span class="number">${total.toLocaleString()} ${unit}</span></td>
      </tr>`;
        } else {
          rows += `
      <tr class="total-row">
        <td><strong>${tableId === "mixtureTable" ? "TOTAL: " : "TOTAL:"}</strong></td>
        <td class="text-end"><span class="number">${total.toLocaleString()} ${unit}</span></td>
        <td></td>
      </tr>`;
        }

        tbody.innerHTML = rows;
      }

      // Provides fallback/example data when API data is unavailable
      function getFallbackData(tableId) {
        const fallback = {
          readymix: {
            labels: [
              "4000psi-28d",
              "3000psi-28d",
              "5000psi-28d",
              "2500psi-28d",
            ],
            data: [1250, 980, 750, 420],
          },
          mixture: {
            labels: [
              "Cement",
              "Fly Ash",
              "Sand",
              "3/4 Gravel",
              "3/8 Gravel",
              "G1",
              "Admix",
              "Water",
            ],
            data: [45000, 12000, 250000, 18000, 12000, 8000, 500, 30000],
          },
          sales: {
            labels: [
              "4000psi-28d",
              "3000psi-28d",
              "5000psi-28d",
              "3500psi-28d",
            ],
            data: [2450, 1980, 1750, 1420],
          },
        };
        return (
          fallback[tableId.replace("Table", "")] || { labels: [], data: [] }
        );
      }

      // Populates all three tables with current chartData
      function populateAllTables() {
        populateTable("readymixTable", chartData.readymix);
        populateTable("mixtureTable", chartData.mixture);
        populateTable("salesTable", chartData.sales, true);
      }

      // === API DATA FETCHING ===
      // Attempts to fetch real data from multiple possible API endpoints
      async function fetchRealData() {
        const apiUrls = [
          `${basePath}reports_data.php?ajax=filter_reports&start_date=${startDate}&end_date=${endDate}`,
          `${basePath}../reports_data.php?ajax=filter_reports&start_date=${startDate}&end_date=${endDate}`,
          `./reports_data.php?ajax=filter_reports&start_date=${startDate}&end_date=${endDate}`,
          `reports_data.php?ajax=filter_reports&start_date=${startDate}&end_date=${endDate}`,
        ];

        for (let url of apiUrls) {
          try {
            const response = await fetch(url, { cache: "no-cache" });
            if (response.ok) {
              const data = await response.json();

              if (data.readymix || data.mixture || data.sales) {
                chartData.readymix = data.readymix || chartData.readymix;
                chartData.mixture = data.mixture || chartData.mixture;
                chartData.sales = data.sales || chartData.sales;
                populateAllTables();
                return true;
              }
            }
          } catch (e) {
            // Continue to next URL if this one fails
          }
        }
        return false;
      }

      // === PDF EXPORT FUNCTION ===
      // Captures each table separately - Page 1: Table 1, Page 2: Table 2, Page 3: Table 3
      async function exportPDF() {
        // Validate required libraries are loaded
        if (typeof html2canvas === 'undefined') {
          alert('PDF library not loaded. Please refresh the page and try again.');
          return;
        }
        if (typeof window.jspdf === 'undefined') {
          alert('PDF library not loaded. Please refresh the page and try again.');
          return;
        }
        
        const btn = event ? event.target : document.querySelector('button[onclick="exportPDF()"]');
        let originalBtnHTML = '';
        if (btn) {
          originalBtnHTML = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Generating PDF...';
          btn.disabled = true;
        }
        
        try {
          const { jsPDF } = window.jspdf;
          
          // Get all cards (tables)
          const cards = document.querySelectorAll('.card');
          
          let pdf = null;
          
          // Process each card separately - each gets its own page
          for (let i = 0; i < cards.length; i++) {
            const card = cards[i];
            const cardTitle = card.querySelector('.card-header').innerText;
            
            // Create wrapper for this card with its own header
            const wrapper = document.createElement('div');
            wrapper.style.cssText = `
              position: absolute;
              top: -9999px;
              left: 0;
              width: 800px;
              background: white;
              padding: 20px 30px;
              font-family: 'Calibri', 'Segoe UI', Arial, sans-serif;
            `;
            
            // Create a fresh header for this page
            const pageHeader = document.createElement('div');
            pageHeader.style.cssText = `
              text-align: center;
              margin-bottom: 25px;
              padding-bottom: 15px;
              border-bottom: 2px solid #4472c4;
            `;
            pageHeader.innerHTML = `
              <h1 style="color: #2c3e50; margin-bottom: 10px; font-size: 24px;">Sorcom Summary Report</h1>
              <p style="color: #6c757d; font-size: 13px; margin: 5px 0;">
                <strong>Period:</strong> ${dateRangeText}
              </p>
              <p style="color: #4472c4; font-size: 14px; margin: 10px 0 0 0; font-weight: bold;">
                ${cardTitle}
              </p>
            `;
            wrapper.appendChild(pageHeader);
            
            // Clone the card
            const cardClone = card.cloneNode(true);
            cardClone.style.cssText = `
              margin-bottom: 0;
              box-shadow: none;
              border: 1px solid #dee2e6;
              page-break-inside: avoid;
            `;
            wrapper.appendChild(cardClone);
            
            document.body.appendChild(wrapper);
            await new Promise(r => setTimeout(r, 50));
            
            // Capture the wrapper
            const canvas = await html2canvas(wrapper, {
              scale: 2.5,
              useCORS: false,
              allowTaint: false,
              backgroundColor: '#ffffff',
              logging: false
            });
            
            document.body.removeChild(wrapper);
            
            const imgWidth = 190;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            const yPosition = 10;
            
            // Create new PDF or add page
            if (pdf === null) {
              // First page - initialize PDF with first image
              pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
              });
              pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 10, yPosition, imgWidth, imgHeight);
            } else {
              // Subsequent pages - add to existing PDF
              pdf.addPage();
              pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 10, yPosition, imgWidth, imgHeight);
            }
          }
          
          // Save the PDF
          if (pdf) {
            const fileName = `sorcom_report_${startDate}_to_${endDate}.pdf`;
            pdf.save(fileName);
          }
          
        } catch (error) {
          console.error('PDF Export Error:', error);
          alert(`Failed to generate PDF: ${error.message}\n\nPlease try using the Print button instead.`);
        } finally {
          if (btn) {
            btn.innerHTML = originalBtnHTML;
            btn.disabled = false;
          }
        }
      }

      // === INITIALIZATION ===
      // Main entry point - loads data when page loads
      async function init() {
        // Try to fetch real API data with 3 second timeout
        const apiSuccess = await Promise.race([
          fetchRealData(),
          new Promise((resolve) => setTimeout(() => resolve(false), 3000)),
        ]);

        // Use fallback data if API fails
        if (!apiSuccess) {
          populateAllTables();
        }
      }

      // Start the application when page loads
      window.addEventListener("load", init);
    </script>
  </body>
</html>
